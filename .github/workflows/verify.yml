name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, test & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The source OAS (specs/) is gitignored, so CI builds from the committed
      # catalog artifacts instead of regenerating them.
      - name: Build from committed catalog
        run: npm run build

      - name: Verify tools manifest invariants
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
